<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhoot Group — Sign in (Automotive Studio)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --auth-car-bg: #050D1A;
  --auth-glass-bg: rgba(12, 26, 48, 0.70);
  --auth-glass-border: rgba(255, 255, 255, 0.14);
  --auth-glass-input-bg: rgba(255, 255, 255, 0.07);
  --auth-glass-input-border: rgba(255, 255, 255, 0.16);
  --auth-brand-blue: #2563EB;
  --auth-brand-blue-hover: #1D4ED8;
  --auth-brand-link: #3B82F6;
  --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  width: 100%;
  font-family: var(--font-sans);
  background-color: var(--auth-car-bg);
  -webkit-font-smoothing: antialiased;
}
body {
  background: radial-gradient(ellipse at 25% 50%, rgba(5, 13, 26, 0.92) 0%, rgba(5, 13, 26, 0.65) 55%, rgba(5, 13, 26, 0.15) 100%), url("/brand/login-car-bg.jpg") no-repeat center right / cover;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.shell {
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
  padding: 40px 60px;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 40px;
}
@media (max-width: 1023px) {
  .shell {
    flex-direction: column;
    padding: 32px 20px;
    gap: 32px;
  }
}
/* Left Brand presentation */
.brand-side {
  flex: 1;
  max-width: 560px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 100%;
  user-select: none;
}
.logo-lockup {
  margin-bottom: 40px;
}
.logo-img {
  width: 64px;
  height: 64px;
  object-fit: contain;
  margin-bottom: 12px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
}
.brand-title {
  font-size: 30px;
  font-weight: 700;
  color: #FFFFFF;
  letter-spacing: -0.01em;
}
.brand-sub {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.72);
  margin-top: 4px;
}
.manifesto {
  margin: 20px 0;
}
.manifesto-words {
  font-size: 38px;
  line-height: 1.25;
  font-weight: 700;
  color: #FFFFFF;
  letter-spacing: 0.06em;
  display: flex;
  flex-direction: column;
}
.accent-line {
  width: 190px;
  height: 3px;
  background: var(--auth-brand-blue);
  border-radius: 999px;
  margin: 20px 0;
}
.tagline {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.24em;
  color: rgba(255, 255, 255, 0.75);
  text-transform: uppercase;
}
.pillars {
  display: flex;
  align-items: center;
  gap: 28px;
  margin-top: 40px;
  padding-top: 28px;
  border-top: 1px solid rgba(255, 255, 255, 0.10);
}
@media (max-width: 1023px) {
  .pillars { display: none; }
}
.pillar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #FFFFFF;
}
.pillar-icon {
  width: 24px;
  height: 24px;
  stroke: rgba(255, 255, 255, 0.85);
  stroke-width: 1.5;
  fill: none;
  flex-shrink: 0;
}
.pillar-text {
  display: flex;
  flex-direction: column;
  font-size: 11px;
  line-height: 14px;
}
.pillar-bld {
  font-weight: 700;
  letter-spacing: 0.05em;
  color: #FFFFFF;
}
.pillar-sub {
  color: rgba(255, 255, 255, 0.70);
  letter-spacing: 0.05em;
}
/* Right Glass Card */
.auth-side {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.glass-card {
  width: 420px;
  max-width: 100%;
  border-radius: 16px;
  background: var(--auth-glass-bg);
  border: 1px solid var(--auth-glass-border);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  box-shadow: 0 24px 60px -15px rgba(0, 10, 30, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.05);
  padding: 36px 32px;
  color: #FFFFFF;
}
.card-sup {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.75);
}
.card-ttl {
  font-size: 28px;
  line-height: 34px;
  font-weight: 700;
  color: #FFFFFF;
  margin: 4px 0 22px 0;
  letter-spacing: -0.02em;
}
.field {
  display: flex;
  flex-direction: column;
  margin-bottom: 16px;
}
.field label {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.85);
  margin-bottom: 6px;
}
.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
}
.input-icon {
  position: absolute;
  left: 14px;
  width: 18px;
  height: 18px;
  stroke: rgba(255, 255, 255, 0.7);
  stroke-width: 1.5;
  fill: none;
  pointer-events: none;
}
.input-ctl {
  width: 100%;
  height: 46px;
  border-radius: 10px;
  background: var(--auth-glass-input-bg);
  border: 1px solid var(--auth-glass-input-border);
  color: #FFFFFF;
  font-family: var(--font-mono);
  font-size: 14px;
  padding: 0 14px 0 42px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input-ctl:focus {
  border-color: var(--auth-brand-blue);
  box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.40);
}
.btn-toggle {
  position: absolute;
  right: 14px;
  background: none;
  border: 0;
  color: var(--auth-brand-link);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.forgot-row {
  display: flex;
  justify-content: flex-end;
  margin-top: -6px;
  margin-bottom: 18px;
}
.forgot-link {
  font-size: 13px;
  font-weight: 500;
  color: var(--auth-brand-link);
  text-decoration: none;
  cursor: pointer;
}
.forgot-link:hover {
  text-decoration: underline;
}
.submit-btn {
  width: 100%;
  height: 46px;
  border-radius: 10px;
  background: var(--auth-brand-blue);
  border: none;
  color: #FFFFFF;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 8px 24px -4px rgba(37, 99, 235, 0.50);
  transition: background-color 0.15s;
}
.submit-btn:hover {
  background: var(--auth-brand-blue-hover);
}
.meta-footer {
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.env-chip {
  height: 20px;
  padding: 0 7px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 500;
  color: #F0CE8A;
  background: rgba(240, 206, 138, 0.14);
  border: 1px solid rgba(240, 206, 138, 0.35);
  display: inline-flex;
  align-items: center;
}
.meta-text {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(255, 255, 255, 0.60);
}
</style>
</head>
<body>

<div class="shell">
  <!-- Left Side: Brand presentation -->
  <section class="brand-side">
    <div class="logo-lockup">
      <img src="/brand/dhoot-mark-clean.png" alt="Dhoot Group" class="logo-img">
      <h1 class="brand-title">Dhoot Group</h1>
      <p class="brand-sub">Dhoot Group · Pre-delivery inspection</p>
    </div>

    <div class="manifesto">
      <div class="manifesto-words">
        <span>PEOPLE</span>
        <span>PROCESSES</span>
        <span>PERFORMANCE</span>
      </div>
      <div class="accent-line"></div>
      <div class="tagline">TOGETHER WE DRIVE MORE</div>
    </div>

    <div class="pillars">
      <div class="pillar-item">
        <svg class="pillar-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <div class="pillar-text">
          <span class="pillar-bld">SAFER</span>
          <span class="pillar-sub">OPERATIONS</span>
        </div>
      </div>
      <div class="pillar-item">
        <svg class="pillar-icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <div class="pillar-text">
          <span class="pillar-bld">BETTER</span>
          <span class="pillar-sub">CUSTOMER EXPERIENCE</span>
        </div>
      </div>
      <div class="pillar-item">
        <svg class="pillar-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <div class="pillar-text">
          <span class="pillar-bld">STRONGER</span>
          <span class="pillar-sub">TOMORROW</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Right Side: Glassmorphic Sign-in Card -->
  <section class="auth-side">
    <div class="glass-card">
      <div class="card-sup">Dhoot Group</div>
      <h2 class="card-ttl">Sign in</h2>

      <form>
        <div class="field">
          <label for="emp-id">Employee ID</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="emp-id" class="input-ctl" value="100482" readonly>
          </div>
        </div>

        <div class="field">
          <label for="pwd">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="pwd" type="password" class="input-ctl" value="pdi123456" readonly>
            <button type="button" class="btn-toggle">Show</button>
          </div>
        </div>

        <div class="forgot-row">
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="button" class="submit-btn">
          <span>Sign in</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>
    </div>

    <div class="meta-footer">
      <span class="env-chip">Staging</span>
      <span class="meta-text">v1.0.3 (412) · Support 1800 000 000</span>
    </div>
  </section>
</div>

</body>
</html>
